<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16255a">
<title>Host Mode · 3D venue designer (preview)</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<style>
:root{--navy:#16255a;--orange:#f6892f;--green:#2f8a4c;--ink:#1c2340;--mut:#5d6684;--line:#e3e6ef;--bg:#f6f7fb;--card:#fff;--red:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--navy);color:#fff}
header b{font-weight:800;letter-spacing:.2px}header b span{color:var(--orange)}
header .name{flex:1;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;padding:5px 8px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.pill.ok{background:var(--green)}.pill.warn{background:var(--orange)}
#stage{position:relative;flex:1 1 55%;min-height:240px;overflow:hidden;background:#dfe3ec}
#v3-canvas{width:100%;height:100%;display:block;touch-action:none}
.tb{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.tb.top{top:8px;left:8px;right:8px}.tb.bot{bottom:8px;left:8px}
.tb button,.chip{border:0;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.tb button.on{background:var(--navy);color:#fff}
.tb .sp{flex:1}
#pad{position:absolute;right:10px;bottom:10px;display:none;grid-template-columns:repeat(3,48px);gap:6px;z-index:2}
#pad button{height:48px;border:0;border-radius:12px;background:rgba(22,37,90,.85);color:#fff;font-size:20px;touch-action:none}
#banner{position:absolute;left:8px;right:8px;top:52px;z-index:3;display:none;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#banner .row{margin-top:8px}
#panel{flex:1 1 45%;overflow:auto;background:var(--card);border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.tabs button{border:0;background:none;padding:7px 11px;border-radius:99px;white-space:nowrap;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.body{padding:12px 14px 40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--navy);color:#fff;cursor:pointer}
.btn.o{background:var(--orange)}.btn.g{background:var(--green)}.btn.l{background:#eef0f6;color:var(--ink)}.btn.r{background:var(--red)}
.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.lib{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer}
.lib small{display:block;color:var(--mut)}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut);min-width:90px;flex:1}
label.f input,label.f select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:var(--ink);background:#fff}
textarea{width:100%;min-height:70px;resize:vertical}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.muted{color:var(--mut);font-size:13px}
.log{font-size:13px;margin:8px 0 0;padding:0;list-style:none}.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.log li.err{color:var(--red)}.log li.warn{color:#a15c00}
.src{font-size:11px;padding:1px 6px;border-radius:99px;background:#eef0f6;color:var(--mut)}
.src.measured{background:#dff3e5;color:var(--green)}.src.confirmed{background:#e3e8f8;color:var(--navy)}.src.estimated{background:#fdeedd;color:#a15c00}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;z-index:9;display:none;max-width:90%}
.v3-nogl{padding:40px 20px;text-align:center}
@media(min-width:900px){#app{display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr)}header{grid-column:1/-1}#stage{min-height:0}#panel{border-top:0;border-left:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Host <span>Mode</span></b>
    <input class="name" id="name" aria-label="Venue name" maxlength="60">
    <span class="pill" id="saveState">Not saved yet</span>
  </header>
  <div id="stage">
    <canvas id="v3-canvas" aria-label="3D view of the venue. Tap an object to select it."></canvas>
    <div class="tb top">
      <button data-view="orbit" class="on">3D</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="walk">Walk</button>
      <span class="sp"></span>
      <button id="undo" aria-label="Undo">↶</button><button id="redo" aria-label="Redo">↷</button>
    </div>
    <div class="tb bot" id="modes">
      <button data-mode="translate" class="on">Move</button><button data-mode="rotate">Turn</button><button data-mode="scale">Resize</button>
    </div>
    <div id="pad" aria-label="Walk controls">
      <span></span><button data-k="f" aria-label="Forward">▲</button><span></span>
      <button data-k="tl" aria-label="Turn left">⟲</button><button data-k="b" aria-label="Back">▼</button><button data-k="tr" aria-label="Turn right">⟳</button>
    </div>
    <div id="banner"></div>
  </div>
  <div id="panel">
    <div class="tabs" role="tablist">
      <button data-tab="ask" class="on">Ask</button><button data-tab="add">Add</button><button data-tab="sel">Selected</button><button data-tab="light">Lights</button><button data-tab="room">Room</button><button data-tab="views">Views</button><button data-tab="file">Save &amp; share</button>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script type="module" src="3d/app.js"></script>
</body>
</html>
