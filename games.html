<script>try{var m=/[?&]e=([^&#]*)/i.exec(location.search),k=m&&"hm_theme_"+decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9-]/g,""),v=k&&JSON.parse(localStorage.getItem(k)||"null");if(v){window.__themePre=1;for(var p in v)if(p.slice(0,2)==="--")document.documentElement.style.setProperty(p,v[p]);if(v.bar){var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute("content",v.bar)}}}catch(e){}</script>

<script>
/* Host Mode's code lives in the js/ folder, one file per part of the app (see CLAUDE.md for the map).
   The files are joined here, in this order, and run as ONE script, exactly as when the code was written inline in this page.
   So: the order below matters, every file shares the same names, and a new file must be added to this list. */
const HM_FILES=["00-constants", "01-content", "02-core", "03-guest", "04-moderator", "05-custom-games", "06-event-types", "07-actions", "08-admin", "09-menu", "10-party-games", "11-tonight", "12-planning", "13-teammates", "14-client-portals", "15-client-tools", "16-planner-portal", "17-inventory-venue", "17a-stay-go", "18-support-staff", "18a-team", "19-leads-boot"];
(function(){const app=document.getElementById("app");
 Promise.all(HM_FILES.map(f=>fetch("js/"+f+".js",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})))
  .then(parts=>{const s=document.createElement("script");s.text=parts.map((p,k)=>"/* ===== js/"+HM_FILES[k]+".js ===== */\n"+p).join("\n");document.body.appendChild(s)})
  .catch(()=>{if(app)app.innerHTML='<div class="card stack"><h2>Couldn\'t load Host Mode</h2><p class="muted">Check the internet connection, then reload this page.</p></div>'})})();
</script>
