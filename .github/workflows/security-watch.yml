name: Security watch
# Nightly, read-only safety check of Host Mode. Files each new problem as one GitLab issue ("security watch").
# This repo is public, so the log shows counts only. Details go to GitLab. See agents/security_watch.py.
# Pause: Actions → Security watch → "..." → Disable workflow.
on:
  schedule:
    - cron: "27 9 * * *"   # about 4:27 AM in Charlotte, after the GitLab nightly agents
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: security-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Self-test
        run: python3 agents/security_watch.py --self-test
      - name: Check Host Mode
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 agents/security_watch.py
