name: Nightly agents
# The test customer tries the demos, then the technical agent works the new support tickets.
# Pause them any time from the admin console (Support tab, Overnight report). See agents/README.md.
on:
  schedule:
    - cron: "13 6 * * *"   # about 1:13 AM in Charlotte (2:13 AM in summer)
  workflow_dispatch: {}
permissions:
  contents: write        # to push fix branches (never main)
  pull-requests: write   # to open pull requests for Roy
  issues: write          # the tap-everything check files what broke as GitHub issues
  actions: write         # ...and then starts the builder queue
concurrency: nightly-agents
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_SUPPORT_CODE: ${{ secrets.AGENT_SUPPORT_CODE }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_MAX_USD: ${{ vars.AGENT_MAX_USD || '1.50' }}
    steps:
      - name: Check the setup
        id: setup
        run: |
          if [ -z "$AGENT_PASSWORD" ]; then echo "The agents aren't set up yet: add the AGENT_PASSWORD and AGENT_SUPPORT_CODE secrets (see agents/README.md)."; echo "ready=no" >> "$GITHUB_OUTPUT"; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.setup.outputs.ready == 'yes'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'yes'
        with:
          python-version: "3.12"
      - name: Install the test browser
        if: steps.setup.outputs.ready == 'yes'
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test customer
        if: steps.setup.outputs.ready == 'yes'
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python agents/tester.py
      - name: Technical agent
        # runs even if the test customer had trouble, so tickets still get answered
        if: always() && steps.setup.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python agents/tech.py
      - name: Tap-everything check (free, no AI)
        # taps every button, fills every box and checks every link in the demos; first proves it can catch planted problems
        id: crawl
        if: always() && steps.setup.outputs.ready == 'yes'
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python agents/crawl.py --self-test
          python agents/crawl.py --max-minutes 25
      - name: File what broke as issues and start the builder queue
        if: always() && steps.crawl.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python agents/file_crawl_issues.py
      - name: Keep tonight's screenshots
        if: always() && steps.setup.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: agent-screens-${{ github.run_id }}
          path: agent-screens/
          retention-days: 7
          if-no-files-found: ignore
