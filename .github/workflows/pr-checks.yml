name: Pull request checks
# Runs on every pull request and on every push to an agent branch (claude/...).
# 1. Broken code  2. The scripted checks on the demos  3. Which of the 14 key screens changed.
# A changed screen doesn't fail the check (changes are often on purpose), but a page error does.
# Uses no secrets, so it is safe on pull requests from anyone.
on:
  pull_request:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the test browser
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Check for broken code
        run: node agents/syntax_check.js
      - name: Record the key screens before this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q origin main
          HEAD_SHA=$(git rev-parse HEAD)
          BASE="${BASE_SHA:-$(git merge-base HEAD origin/main)}"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          git checkout -q "$BASE"
          python -m http.server 8765 >/dev/null 2>&1 &
          SERVER=$!
          sleep 2
          python agents/compare_screens.py before || true
          kill $SERVER
          git checkout -q "$HEAD_SHA"
      - name: Scripted checks on the demos
        run: bash agents/check_all.sh
      - name: Compare the key screens
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          SERVER=$!
          sleep 2
          python agents/compare_screens.py after > agent-screens/compare.txt 2>&1 || true
          kill $SERVER
          cat agent-screens/compare.txt
          { echo "### Key screens"; echo '```'; cat agent-screens/compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "^ERRORS" agent-screens/compare.txt; then echo "A key screen shows a page error."; exit 1; fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-screens-${{ github.run_id }}
          path: agent-screens/
          retention-days: 7
          if-no-files-found: ignore
