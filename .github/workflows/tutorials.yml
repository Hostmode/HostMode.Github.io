name: Tutorial videos
# Makes Host Mode's video tutorials during the day, while the night agents are off: 4 slots a day, aiming for
# 4 finished videos a day (a slot that falls short is made up by the next one). See agents/tutorials/README.md.
# Each video: the step writer (Claude) writes the narration and clicks from the real demo if needed, a browser
# records the live demo, a free voice (Piper; HeyGen if HEYGEN_API_KEY is set) reads it, ffmpeg adds the captions
# and the Host Mode look. Videos go in the DRAFT release "tutorial-library" (only people with repo access can see
# it); the queue, scripts and captions go in the tutorials-data branch. Nothing is published without Roy.
# Spending: at most TUTORIAL_MAX_USD of Claude credits a slot (default $0.40), only while scripts are being written.
# Pause it: Actions → Tutorial videos → "..." → Disable workflow.
on:
  schedule:
    - cron: "43 14 * * *"   # about 9:43 AM in Charlotte (10:43 AM in summer)
    - cron: "43 17 * * *"   # about 12:43 PM
    - cron: "43 20 * * *"   # about 3:43 PM
    - cron: "43 23 * * *"   # about 6:43 PM
  workflow_dispatch:
    inputs:
      slot:
        description: "Make videos until today's count reaches this number (0 = one more video)"
        required: false
        default: "0"
permissions:
  contents: write   # the tutorials-data branch and the draft release
concurrency:
  group: tutorials
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      TUTORIAL_VOICE_ID: ${{ vars.TUTORIAL_VOICE_ID }}
      TUTORIAL_PIPER_VOICE: ${{ vars.TUTORIAL_PIPER_VOICE || 'en_US-lessac-medium' }}
      AGENT_MAX_USD: ${{ vars.TUTORIAL_MAX_USD || '0.40' }}
      TUTORIAL_BASE: https://hostmode.github.io/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser, ffmpeg and the free voice
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install --quiet playwright piper-tts
          python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-${{ vars.TUTORIAL_PIPER_VOICE || 'en_US-lessac-medium' }}
      - name: Open the tutorials-data branch
        run: |
          git config --global user.name "Claude"
          git config --global user.email "noreply@anthropic.com"
          git fetch -q origin tutorials-data
          git worktree add -q tdata origin/tutorials-data
      - name: Make the videos
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          case "$SCHEDULE" in
            "43 14 * * *") SLOT=1 ;; "43 17 * * *") SLOT=2 ;; "43 20 * * *") SLOT=3 ;; "43 23 * * *") SLOT=4 ;;
            *) SLOT="${INPUT_SLOT:-0}" ;;
          esac
          case "$SLOT" in ''|*[!0-9]*) SLOT=0 ;; esac
          python agents/tutorials/run.py --data tdata --slot "$SLOT"
      - name: Save the queue and the scripts
        if: always()
        run: |
          cd tdata
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Tutorials: $(TZ=America/New_York date '+%b %d %I:%M %p')"
          git push origin HEAD:tutorials-data
      - name: Keep tonight's check sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-checks-${{ github.run_id }}
          path: tutorial-out/**/*_check.png
          retention-days: 7
          if-no-files-found: ignore
