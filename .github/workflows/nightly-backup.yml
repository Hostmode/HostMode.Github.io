name: Nightly backup
# Copies the whole database every night, encrypted, and keeps 30 days of copies.
# How to open one: see ops/BACKUPS.md
on:
  schedule:
    - cron: "41 7 * * *"   # about 2:41 AM in Charlotte (3:41 AM in summer)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: nightly-backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Back up the database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python ops/backup.py
      - name: Keep the encrypted copy for 30 days
        if: hashFiles('backup/hostmode-backup.json.gz.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hostmode-backup-${{ github.run_id }}
          path: backup/hostmode-backup.json.gz.enc
          retention-days: 30
          if-no-files-found: ignore
