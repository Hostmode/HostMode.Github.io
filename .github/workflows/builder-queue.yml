name: Builder queue
# Starts the builder on the next issue labeled "queue", ONE job at a time, so each job starts from the newest main.
# Runs when a builder pull request is merged or closed, when an issue gets the "queue" label, and by hand
# (Actions → Builder queue → Run workflow). Auto-merge also starts it.
# Order: an issue also labeled "next" goes first; otherwise the oldest queued issue. Issues labeled "needs Roy" are skipped.
# It waits while any builder pull request is open or a builder run is going, and during the event freeze (Dec 31 to Jan 3).
# It starts the builder by having Claude's bot post one fixed comment on the issue (a comment from the repo's own token
# wouldn't start the builder). No issue text is passed to Claude here. Pause it: Actions → Builder queue → Disable workflow.
on:
  pull_request:
    types: [closed]
  issues:
    types: [labeled]
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  id-token: write
concurrency:
  group: builder-queue
  cancel-in-progress: false
jobs:
  next:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'claude/')) ||
      (github.event_name == 'issues' && github.event.label.name == 'queue')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the next issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          R="$GITHUB_REPOSITORY"
          MD=$(TZ=America/New_York date +%m%d)
          if [ "$MD" = "1231" ] || [ "$MD" -le "0103" ]; then echo "Event freeze (Dec 31 to Jan 3): not starting anything."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          sleep 20  # let a just-merged pull request and its runs settle
          OPEN=$(gh pr list --repo "$R" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/"))] | length')
          RUNNING=$(gh api "repos/$R/actions/workflows/claude-builder.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$OPEN" != "0" ] || [ "$RUNNING" != "0" ]; then echo "A builder job is still open ($OPEN pull requests, $RUNNING runs). Waiting."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(gh issue list --repo "$R" --label queue --state open --limit 100 --json number,labels,createdAt --jq '
            [.[] | select(([.labels[].name] | index("needs Roy")) | not)]
            | sort_by([(([.labels[].name] | index("next")) | not), .createdAt]) | .[0].number // empty')
          if [ -z "$N" ]; then echo "Nothing queued."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Next up: issue #$N"
          gh issue edit "$N" --repo "$R" --remove-label queue --remove-label next --add-label claude >/dev/null
          { echo "go=yes"; echo "num=$N"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.pick.outputs.go == 'yes'
        with:
          fetch-depth: 1
      - name: Start the builder on it
        if: steps.pick.outputs.go == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run exactly this one command, then stop. Don't read any files or issues.
            gh issue comment ${{ steps.pick.outputs.num }} --repo ${{ github.repository }} --body "@claude please build this issue. Follow its Done when list and CLAUDE.md. Started by the builder queue. <!-- queue-start -->"
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 3
            --allowedTools "Bash(gh issue comment:*)"
