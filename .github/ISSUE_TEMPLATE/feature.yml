name: New feature
description: Something new for Host Mode, or a change to something that works today
title: "Feature: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: "One job per issue. If it's big, split it into parts (part 1 of 3, and so on). When it's ready to build, add the **claude** label."
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      description: In plain words, from the user's side.
      placeholder: "Planners can download a calendar file with all their events, bookings and shifts."
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who uses it?
      multiple: true
      options: [Planners and venues, Hosts, Guests, Clients, Teammates, Vendors, Roy and staff]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: "Planner portal → Calendar tab"
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks anyone can try on the demo (games.html?pdemo=1#planner or games.html?e=demo).
      value: |
        - [ ] 
        - [ ] Works on a phone-sized screen
        - [ ] Help desk entry added
        - [ ] A check added to agents/regressions.json
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: How risky is it?
      options:
        - "Low: wording, Help desk, tests"
        - "Normal: a new feature or screen"
        - "High: database rules, security, money, deleting, or guest, moderator and big-screen screens"
    validations:
      required: true
