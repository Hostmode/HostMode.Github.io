# Eddie's brain: a Cloudflare Worker that runs Workers AI (free plan: 10,000 units a day).
# Installed by .github/workflows/eddie-brain.yml with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
name = "eddie-brain"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[ai]
binding = "AI"
